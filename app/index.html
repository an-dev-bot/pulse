<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://platform.twitter.com https://cdn.syndication.twimg.com; style-src 'self' 'unsafe-inline' https://platform.twitter.com https://*.twimg.com; connect-src 'self' https://api.coingecko.com https://api.geckoterminal.com https://api.dexscreener.com; img-src 'self' data: https://*.twimg.com https://platform.twitter.com https://syndication.twitter.com; frame-src https://platform.twitter.com https://syndication.twitter.com https://twitter.com https://x.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="__THEME__">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__NAME__">
<title>__NAME__</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<div class="shell" id="shell">
  <nav class="nav" aria-label="__NAME__">
    <div class="nav-brand"><span class="pulse-dot" aria-hidden="true"></span><b>__NAME__</b></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </nav>

  <header class="top">
    <div class="bar">
      <div class="brand"><span class="pulse-dot" aria-hidden="true"></span><b id="brand">__NAME__</b></div>
      <h1 id="view-title" class="view-title"></h1>
      <span id="net" class="net mono" hidden></span>
      <button id="btn-search" class="ib" type="button" data-i18n-label="search"></button>
      <button id="btn-rail" class="ib rail-btn" type="button" data-i18n-label="rail.hide"></button>
    </div>
    <div id="ticker" class="ticker" role="list"></div>
  </header>

  <main id="main">
    <div id="offline" class="offline" hidden></div>
    <section class="view" id="v-live" data-view="live"></section>
    <section class="view" id="v-markets" data-view="markets" hidden></section>
    <section class="view" id="v-memes" data-view="memes" hidden></section>
    <section class="view" id="v-calendar" data-view="calendar" hidden></section>
    <section class="view" id="v-more" data-view="more" hidden></section>
  </main>

  <aside class="side" id="side" aria-label="Side panel"></aside>
</div>
<button id="pill" class="pill" type="button" hidden></button>
<div id="toast" class="toast" role="status" hidden></div>

<div id="sheet-search" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-bar">
    <input id="q" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="search.ph">
    <button type="button" class="ib" data-close data-i18n-label="close"></button>
  </div>
  <div id="results" class="sheet-body"></div>
</div>

<div id="sheet-detail" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-bar">
    <h2 id="detail-title"></h2>
    <button type="button" class="ib" data-close data-i18n-label="close"></button>
  </div>
  <div id="detail-body" class="sheet-body"></div>
</div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
